# ==================================================
# JobXpress - Stack VPS (OVH 51.38.99.226)
# ==================================================
# Cible : ~1 Go RAM plafonne. Caddy deja present sur l'hote (80/443) :
# il frontalise api:8000 et web:3000 via 127.0.0.1 uniquement.
#
# Mise en route (apres la phase 3 de decouplage Supabase) :
#   1. cp api.env.example /opt/jobxpress/.env.api   (remplir les secrets)
#   2. docker compose --env-file .env.api up -d --build
#   3. Ajouter les blocs Caddy (voir Caddyfile.snippet) + reload
name: jobxpress

services:
  postgres:
    image: pgvector/pgvector:pg16   # job_offers_v2 utilise halfvec (pgvector 0.8)
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobxpress
      POSTGRES_USER: jobxpress
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir dans .env.api}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobxpress"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    networks: [jobxpress]
    # Jamais expose a l'externe : uniquement le reseau docker

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?definir dans .env.api} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 160M
    networks: [jobxpress]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir dans .env.api}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir dans .env.api}
    volumes:
      - miniodata:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [jobxpress]

  postgrest:
    image: postgrest/postgrest:v13.0.7
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://jobxpress:${POSTGRES_PASSWORD}@postgres:5432/jobxpress
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,auth
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_ANON_ROLE: anon
      PGRST_SERVER_PROXY_URI: https://api.jobxpress.fr
      PGRST_OPEN_SERVER_INTROSPECTION: ""    # schema cache auto-reload
    ports:
      - "127.0.0.1:8011:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 96M
    networks: [jobxpress]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8012:8080"
    depends_on: [postgrest, gotrue]
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [jobxpress]

  # Auth standalone (ex-Supabase Auth) : GoTrue, un seul binaire Go.
  # Remplace le cloud Supabase Auth sans toucher au frontend (supabase-js parle a /auth/v1).
  gotrue:
    image: supabase/gotrue:v2.187.0
    restart: unless-stopped
    # Set de migrations COMPLET monte en volume (le set embarque dans l'image
    # est tronque et echoue en standalone) - voir scripts/fetch_gotrue_migrations.py
    volumes:
      - ./gotrue-migrations:/migrations:ro
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://jobxpress:${POSTGRES_PASSWORD}@postgres:5432/jobxpress?options=-c%20search_path%3Dauth
      GOTRUE_DB_MIGRATIONS_PATH: /migrations
      GOTRUE_SITE_URL: ${SITE_URL:-https://jobxpress.fr}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL:-https://jobxpress.fr}/auth/callback
      API_EXTERNAL_URL: https://api.jobxpress.fr/auth/v1
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_API_PORT: "9999"
      GOTRUE_DISABLE_SIGNUP: "false"
      # Google OAuth (creds recuperees depuis la config Supabase cloud)
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://api.jobxpress.fr/auth/v1/callback
      # Azure AD (3 comptes utilisateurs s'y connectent)
      GOTRUE_EXTERNAL_AZURE_ENABLED: "true"
      GOTRUE_EXTERNAL_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      GOTRUE_EXTERNAL_AZURE_SECRET: ${AZURE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_AZURE_REDIRECT_URI: https://api.jobxpress.fr/auth/v1/callback
      # Mailer (SMTP Brevo relay - meme compte que Supabase)
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: smtp-relay.brevo.com
      GOTRUE_SMTP_PORT: "588"
      GOTRUE_SMTP_USER: ${BREVO_SMTP_USER}
      GOTRUE_SMTP_PASS: ${BREVO_SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: Jimmy
      GOTRUE_SMTP_SENDER_EMAIL: ${SENDER_EMAIL}
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [jobxpress]

  api:
    build:
      context: ../job_xpress
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.api
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      PORT: "10000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://jobxpress.fr,https://www.jobxpress.fr,https://app.jobxpress.fr,http://localhost:3000}
      # Cibles internes : ecrasent tout URL externe
      DATABASE_URL: postgresql://jobxpress:${POSTGRES_PASSWORD}@postgres:5432/jobxpress
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SUPABASE_URL: http://gateway:8080
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8010:10000"   # -> Caddy api.jobxpress.fr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:10000/', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M
    networks: [jobxpress]

  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.jobxpress.fr
        NEXT_PUBLIC_SUPABASE_URL: https://api.jobxpress.fr
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_KEY}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"   # -> Caddy app.jobxpress.fr / jobxpress.fr
    depends_on: [api]
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [jobxpress]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  jobxpress:
    driver: bridge
